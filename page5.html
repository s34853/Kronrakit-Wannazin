<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางการติดต่อ - กรกฤต วรรณศิลป์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* โครงสร้างการ์ดหลักสไตล์สว่าง */
        .contact-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            padding: 50px 40px;
            max-width: 650px;
            width: 100%;
            border: 1px solid #ffffff;
        }

        /* หัวข้อหลัก */
        .title-container {
            text-align: center;
            margin-bottom: 35px;
        }
        
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* รายการช่องทางติดต่อ */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 35px;
        }

        .contact-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-left: 6px solid #2a5298;
            padding: 18px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            transform: translateY(-2px) translateX(4px);
            border-color: #2a5298;
            box-shadow: 0 8px 20px rgba(42, 82, 152, 0.1);
        }

        .icon-box {
            font-size: 1.6rem;
            width: 48px;
            height: 48px;
            background: #e0e7ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e3c72;
        }

        .details {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-weight: 700;
            color: #1e3c72;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .value {
            color: #334155;
            font-size: 1.15rem;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a.value:hover {
            color: #2a5298;
            text-decoration: underline;
        }

        /* ปุ่มย้อนกลับและกลับหน้าแรก */
        .button-group {
            display: flex;
            gap: 18px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 30px;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-back {
            background-color: #ffffff;
            color: #475569;
            border: 2px solid #cbd5e0;
        }

        .btn-back:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #94a3b8;
            transform: translateY(-2px);
        }

        .btn-home {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: #ffffff;
            border: 2px solid #1e3c72;
            box-shadow: 0 4px 15px rgba(42, 82, 152, 0.35);
        }

        .btn-home:hover {
            background: linear-gradient(135deg, #1e3c72 0%, #14284b 100%);
            box-shadow: 0 6px 20px rgba(42, 82, 152, 0.5);
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .contact-card {
                padding: 40px 20px;
            }
            .button-group {
                flex-direction: column-reverse;
            }
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="title-container">
            <h1>CONTACT ME</h1>
            <div class="subtitle">ช่องทางการติดต่อ</div>
        </div>

        <div class="contact-list">
            <!-- เบอร์โทรศัพท์ -->
            <div class="contact-item">
                <div class="icon-box">📞</div>
                <div class="details">
                    <span class="label">เบอร์โทรศัพท์</span>
                    <a href="tel:0955654067" class="value">095-565-4067</a>
                </div>
            </div>

            <!-- อีเมล -->
            <div class="contact-item">
                <div class="icon-box">✉️</div>
                <div class="details">
                    <span class="label">อีเมล</span>
                    <a href="mailto:kronrakit28@gmail.com" class="value">kronrakit28@gmail.com</a>
                </div>
            </div>

            <!-- Instagram -->
            <div class="contact-item">
                <div class="icon-box">📷</div>
                <div class="details">
                    <span class="label">Instagram</span>
                    <a href="https://www.instagram.com/kronrakit007x" class="value" target="_blank">kronrakit007x</a>
                </div>
            </div>

            <!-- Facebook -->
            <div class="contact-item">
                <div class="icon-box">📘</div>
                <div class="details">
                    <span class="label">Facebook</span>
                    <span class="value">Kronrakit Wannazin</span>
                </div>
            </div>
        </div>

        <!-- ปุ่มกดควบคุม -->
        <div class="button-group">
            <a href="page4.html" class="btn btn-back">⬅ ย้อนกลับใบเกียรติบัตร</a>
            <a href="index.html" class="btn btn-home">กลับหน้าแรก 🏠</a>
        </div>
    </div>

</body>
</html>
