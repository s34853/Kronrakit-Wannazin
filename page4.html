<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบเกียรติบัตร - กรกฤต วรรณศิลป์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .cert-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
            padding: 45px 35px;
            max-width: 850px;
            width: 100%;
        }

        /* หัวข้อเด่นชัด */
        .title-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1.cert-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* จัดเลย์เอาต์รูปเป็น Grid 2x2 */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 650px) {
            .cert-grid {
                grid-template-columns: 1fr;
            }
        }

        /* กรอบรูปภาพทรงแนวนอนสัดส่วนพอดีเกียรติบัตร */
        .cert-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        .cert-item:hover {
            transform: translateY(-4px);
            border-color: #2a5298;
            box-shadow: 0 10px 25px rgba(42, 82, 152, 0.2);
        }
        .cert-item img {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            object-fit: contain; /* แสดงรูปเต็มใบไม่ตัดขอบ */
            border-radius: 10px;
            display: block;
            background-color: #f8fafc;
        }

        /* ปุ่มกดควบคุม */
        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-back {
            background-color: #64748b;
            color: white;
        }
        .btn-back:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }
        .btn-next {
            background: linear-gradient(135deg, #2a5298, #1e3c72);
            color: white;
            box-shadow: 0 4px 14px rgba(42, 82, 152, 0.3);
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(42, 82, 152, 0.45);
        }
    </style>
</head>
<body>

    <div class="cert-card">
        <div class="title-container">
            <h1 class="cert-title">ใบเกียรติบัตร</h1>
            <div class="subtitle">CERTIFICATES & AWARDS</div>
        </div>

        <!-- แสดง 4 รูปใบเกียรติบัตร -->
        <div class="cert-grid">
            <div class="cert-item">
                <img src="S__50692099.jpg" alt="เกียรติบัตร Internet Alertness">
            </div>
            <div class="cert-item">
                <img src="S__50692100.jpg" alt="เกียรติบัตร Internet Kindness">
            </div>
            <div class="cert-item">
                <img src="S__50692101.jpg" alt="เกียรติบัตร Internet Strength">
            </div>
            <div class="cert-item">
                <img src="S__50692102.jpg" alt="เกียรติบัตร Internet Smartness">
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="button-group">
            <a href="page3.html" class="btn btn-back">⬅ ทักษะและความสนใจ</a>
            <a href="page5.html" class="btn btn-next">ช่องทางการติดต่อ ➔</a>
        </div>
    </div>

</body>
</html>
