<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO - กรกฤต วรรณศิลป์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* โครงสร้างการ์ดหลักขนาดใหญ่สไตล์สว่าง */
        .hero-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            padding: 55px 45px;
            max-width: 850px;
            width: 100%;
            text-align: center;
            border: 1px solid #ffffff;
        }

        /* กรอบรูปสี่เหลี่ยมผืนผ้าทรงนักเรียนแบบพอดีรูป */
        .profile-wrapper {
            width: 190px;
            height: 240px;
            margin: 0 auto 25px;
            border-radius: 20px;
            padding: 6px;
            background: #ffffff;
            border: 3px solid #2a5298;
            box-shadow: 0 10px 25px rgba(42, 82, 152, 0.2);
            transition: all 0.3s ease;
        }

        .profile-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(42, 82, 152, 0.35);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ปรับรูปให้อยู่ในกรอบพอดีไม่เบี้ยว */
            object-position: center top;
            border-radius: 14px;
            display: block;
        }

        /* ป้ายต้อนรับ */
        .welcome-badge {
            display: inline-block;
            background: #e0e7ff;
            color: #1e3c72;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* ชื่อหลักขนาดใหญ่เด่นชัด */
        h1.name-title {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 35px;
        }

        /* กล่องไฮไลต์ข้อมูลแบบมินิมอล */
        .info-pills {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .pill-item {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
        }

        /* ปุ่มเข้าชมแฟ้มสะสมผลงาน */
        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 18px 45px;
            border-radius: 18px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(42, 82, 152, 0.35);
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(42, 82, 152, 0.5);
            background: linear-gradient(135deg, #1e3c72 0%, #14284b 100%);
        }

        .btn-enter span.arrow {
            font-size: 1.4rem;
            transition: transform 0.3s ease;
        }

        .btn-enter:hover span.arrow {
            transform: translateX(6px);
        }

        @media (max-width: 600px) {
            .hero-card {
                padding: 40px 20px;
            }
            h1.name-title {
                font-size: 2.3rem;
            }
            p.subtitle {
                font-size: 1.05rem;
            }
            .btn-enter {
                width: 100%;
                font-size: 1.1rem;
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-card">
        <!-- รูปโปรไฟล์ -->
        <div class="profile-wrapper">
            <img src="S__50692103_2.jpg" alt="กรกฤต วรรณศิลป์" class="profile-img">
        </div>

        <!-- ป้ายต้อนรับ -->
        <div class="welcome-badge">WELCOME TO MY PORTFOLIO</div>

        <!-- ชื่อ-นามสกุล -->
        <h1 class="name-title">กรกฤต วรรณศิลป์</h1>
        <p class="subtitle">แฟ้มสะสมผลงานการเรียนรู้และกิจกรรม</p>

        <!-- ไฮไลต์ผลงาน -->
        <div class="info-pills">
            <div class="pill-item">💻 Computer & Technology</div>
            <div class="pill-item">📐 Mathematics</div>
            <div class="pill-item">🏆 Be Internet Awesome</div>
        </div>

        <!-- ปุ่มเข้าชมเว็บ -->
        <a href="page2.html" class="btn-enter">
            เข้าชมแฟ้มสะสมผลงาน <span class="arrow">➔</span>
        </a>
    </div>

</body>
</html>
