<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .portfolio-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4a90e2;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h1 {
            font-size: 2rem;
            color: #1a252f;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #4a90e2;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-next {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.2s;
        }
        .btn-next:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <!-- เปลี่ยน URL รูปภาพตรง src เป็นลิงก์รูป หรือใส่ชื่อไฟล์รูปของคุณ เช่น src="profile.jpg" -->
        <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-img">
        
        <h1>PORTFOLIO</h1>
        <div class="subtitle">แฟ้มสะสมผลงาน</div>
        <p>ยินดีต้อนรับเข้าสู่เว็บไซต์ Portfolio ของฉัน คลิกปุ่มด้านล่างเพื่อดูประวัติส่วนตัวและรายละเอียดเพิ่มเติมได้เลยครับ/ค่ะ</p>
        
        <!-- ปุ่มไปหน้าประวัติส่วนตัว -->
        <a href="page2.html" class="btn-next">ดูประวัติส่วนตัว ➔</a>
    </div>

</body>
</html>
