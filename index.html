<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .portfolio-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        
        /* กรอบรูปถ่ายนักเรียน/โปรไฟล์ */
        .img-container {
            width: 180px;
            height: 230px; /* อัตราส่วนแนวตั้งพอดีกับรูปนักเรียน */
            margin: 0 auto 25px auto;
            border-radius: 16px;
            padding: 6px;
            background: linear-gradient(135deg, #2b5876, #4e4376);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        /* ตกแต่งคำว่า PORTFOLIO ให้โดดเด่น */
        h1.portfolio-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .subtitle {
            color: #555;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* ปุ่มไปหน้าถัดไป */
        .btn-next {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2a5298, #1e3c72);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
            transition: all 0.3s ease;
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(42, 82, 152, 0.45);
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <!-- กรอบและรูปโปรไฟล์ -->
        <div class="img-container">
            <img src="S__50692103.jpg" alt="Profile Picture" class="profile-img">
        </div>
        
        <!-- ข้อความ PORTFOLIO แบบเด่นชัด -->
        <h1 class="portfolio-title">PORTFOLIO</h1>
        <div class="subtitle">แฟ้มสะสมผลงาน</div>
        
        <p>ยินดีต้อนรับเข้าสู่เว็บไซต์ Portfolio ของผม สามารถกดปุ่มด้านล่างเพื่อดูข้อมูลประวัติส่วนตัวได้เลยครับ</p>
        
        <!-- ปุ่มไปหน้าประวัติส่วนตัว -->
        <a href="page2.html" class="btn-next">ดูประวัติส่วนตัว ➔</a>
    </div>

</body>
</html>
