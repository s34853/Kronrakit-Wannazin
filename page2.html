<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - กรณกฤต วรรณศิลป์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .profile-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
        }
        
        /* หัวข้อหน้า */
        .title-container {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        /* กล่องข้อมูลประวัติ */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .info-item {
            background: #f8fafc;
            border-left: 4px solid #2a5298;
            padding: 12px 16px;
            border-radius: 0 10px 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-item.full-width {
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }
        .label {
            font-weight: bold;
            color: #1e3c72;
            font-size: 0.95rem;
        }
        .value {
            color: #333;
            font-size: 1rem;
            font-weight: 600;
        }
        .highlight {
            color: #e65100; /* สีส้มเพิ่มจุดเด่นให้คณะและมหาลัย */
            font-weight: 700;
        }

        /* ช่องสำหรับเขียนบันทึกเพิ่มเติม */
        .input-group {
            margin-top: 20px;
        }
        .input-group label {
            font-weight: bold;
            color: #1e3c72;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1.5px solid #cbd5e0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #2a5298;
            box-shadow: 0 0 6px rgba(42, 82, 152, 0.25);
        }

        /* ปุ่มย้อนกลับ */
        .btn-back {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 25px;
            padding: 12px;
            background-color: #64748b;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="title-container">
            <h1>PROFILE</h1>
            <div class="subtitle">ข้อมูลประวัติส่วนตัว</div>
        </div>

        <div class="info-list">
            <div class="info-item">
                <span class="label">ชื่อ-นามสกุล:</span>
                <span class="value">นายกรกฤต วรรณศิลป์</span>
            </div>

            <div class="info-item">
                <span class="label">ชื่อเล่น:</span>
                <span class="value">ทาม</span>
            </div>

            <div class="info-item">
                <span class="label">อายุ:</span>
                <span class="value">17 ปี</span>
            </div>

            <div class="info-item full-width">
                <span class="label">มหาวิทยาลัยที่ต้องการเข้า:</span>
                <span class="value highlight">สถาบันเทคโนโลยีพระจอมเกล้าลาดกระบัง</span>
            </div>

            <div class="info-item full-width">
                <span class="label">คณะ / สาขา:</span>
                <span class="value highlight">วิศวกรรมศาสตร์ สาขาวิศวกรรมไฟฟ้า</span>
            </div>
        </div>

        <!-- ช่องพิมพ์บันทึกเพิ่มเติม -->
        <div class="input-group">
            <label for="user-notes">📝 บันทึกเพิ่มเติม / เป้าหมาย:</label>
            <textarea id="user-notes" placeholder="พิมพ์คติพจน์ ผลงาน หรือเป้าหมายเพิ่มเติมตรงนี้..."></textarea>
        </div>

        <!-- ปุ่มย้อนกลับ -->
        <a href="index.html" class="btn-back">⬅ ย้อนกลับหน้าแรก</a>
    </div>

</body>
</html>
